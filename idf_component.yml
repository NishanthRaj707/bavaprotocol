version: "1.0.4"
description: "BAVA - Bidirectional Asynchronous Versatile Architecture Protocol. Universal transport-agnostic O(1) zero-allocation framing protocol for UART, SPI, Wi-Fi, BLE, and embedded buses."
url: "https://github.com/NishanthRaj707/bavaprotocol"
maintainers:
  - "Nishanth Raj <https://github.com/NishanthRaj707>"
tags:
  - "protocol"
  - "framing"
  - "transport-agnostic"
  - "uart"
  - "spi"
  - "ble"
  - "wifi"
  - "serialization"
  - "embedded"
  - "bare-metal"
targets:
  - esp32
  - esp32s2
  - esp32s3
  - esp32c3
  - esp32c6
  - esp32h2
dependencies:
  idf:
    version: ">=4.3.0"
