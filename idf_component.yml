version: "2.0.0"
description: "Static-memory C99 frame and write validation layer for UART links. Enforces COBS framing, CRC-16 integrity, and size/permission-checked dictionary commits before updating application memory."
url: "https://github.com/Nishanth707/bava"
repository: "https://github.com/Nishanth707/bava"
issues: "https://github.com/Nishanth707/bava/issues"
license: "GPL-3.0-only"
maintainers:
  - "J. Nishanth Raj (BAVA) <https://github.com/Nishanth707>"
tags:
  - "uart"
  - "validation"
  - "cobs"
  - "crc16"
  - "serialization"
  - "static-memory"
  - "embedded"
targets:
  - esp32
  - esp32s2
  - esp32s3
  - esp32c3
  - esp32c6
  - esp32h2
dependencies:
  idf:
    version: ">=4.3.0"
